[project]
name = "app"
version = "0.1.0"
description = "Structured Aligned LM"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "accelerate==0.33.0",
    "datasets==2.19.*",
    "evaluate>=0.4.5",
    "fastapi>=0.116.1",
    "matplotlib>=3.10.5",
    "nltk>=3.9.1",
    "numpy==1.26.4",
    "orjson>=3.11.3",
    "pandas>=2.3.2",
    "peft==0.11.*",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "rich>=14.1.0",
    "rouge-score>=0.1.2",
    "scikit-learn==1.4.*",
    "sentence-transformers==3.0.*",
    "spacy>=3.8.7",
    "torch==2.5.1",
    "transformers==4.43.*",
    "trl==0.10.*",
    "typer>=0.16.1",
    "uvicorn>=0.35.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
# Only torch should come from the cu121 index.
torch = { index = "pytorch-cu121" }
